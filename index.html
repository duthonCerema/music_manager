<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Music Curator - Stable avec Source</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --primary: #1DB954; --text: #fff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 90%; max-width: 800px; background: var(--card); padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #player-wrapper { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; margin: 20px 0; }
        #player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        button { padding: 15px 25px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-like { background: var(--primary); color: white; }
        .btn-dislike { background: #e74c3c; color: white; }
        .btn-nav { background: #444; color: white; }
        .status { margin-top: 15px; color: #888; font-size: 0.8em; }
        .source-tag { font-size: 0.7em; color: #666; margin-top: 5px; word-break: break-all; }
        #vote-msg { height: 20px; margin-top: 10px; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">Chargement...</h2>

        <iframe id="yt-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div id="vote-msg"></div>

        <button class="btn-nav" onclick="changeTrack(-1)">⏮</button>

</div>

    let currentIndex = 0;

    function updateUI() {
        if (tracks.length === 0) return;
        const track = tracks[currentIndex];
        const videoId = track.url.split('v=')[1];
        
        document.getElementById('title').innerText = track.titre;
        document.getElementById('artist').innerText = track.artiste;
        document.getElementById('source').innerText = "Origine : " + track.source;
        document.getElementById('progress').innerText = (currentIndex + 1) + " / " + tracks.length;
        document.getElementById('vote-msg').innerText = ""; 
        
        document.getElementById('yt-iframe').src = `https://www.youtube.com/embed/${videoId}?rel=0&autoplay=1`;
    }

    function changeTrack(delta) {
        currentIndex += delta;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= tracks.length) {
            alert("Fin de la liste !");
            currentIndex = tracks.length - 1;
        }
        updateUI();
    }

    async function vote(note) {
        const track = tracks[currentIndex];
        const msgZone = document.getElementById('vote-msg');
        msgZone.innerText = "Envoi du vote...";

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ 
                    artiste: track.artiste, 
                    titre: track.titre, 
                    note: note,
                    source: track.source // Transmission au Google Sheet
                })
            });
            msgZone.innerText = "Vote enregistré ! ✅";
        } catch (e) { 
            msgZone.innerText = "Erreur ❌";
        }
    }

    updateUI();
</script>
