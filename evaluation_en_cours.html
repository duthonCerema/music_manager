<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Curator - AutoPlay Mobile</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --primary: #1DB954; --text: #fff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 90%; max-width: 800px; background: var(--card); padding: 20px; border-radius: 20px; text-align: center; }
        #player-wrapper { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; margin: 20px 0; }
        #player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        button { padding: 15px 25px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; }
        .btn-like { background: var(--primary); color: white; }
        .btn-dislike { background: #e74c3c; color: white; }
        .btn-nav { background: #444; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">Chargement...</h2>
    <p id="artist" style="color: var(--primary)"></p>

    <div id="player-wrapper">
        <div id="player"></div>
    </div>

    <div class="controls">
        <button class="btn-nav" onclick="changeTrack(-1)">⏮</button>
        <button id="btn-no" class="btn-dislike" onclick="vote(0)">👎</button>
        <button id="btn-yes" class="btn-like" onclick="vote(5)">👍</button>
        <button class="btn-nav" onclick="changeTrack(1)">⏭</button>
    </div>
    <p id="progress">0 / 0</p>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHo9m3CQDd0PJWdlOQk9AdiC0NmBbrnjEn5Bwh62SE2GmBJUjMIKujvqu583xwVvqUJQ/exec";
    const tracks = JSON.parse('[{"titre": "drop dead", "artiste": "Olivia Rodrigo", "url": "https://www.youtube.com/watch?v=PznkDLztID0"}, {"titre": "Potential", "artiste": "sombr", "url": "https://www.youtube.com/watch?v=tNZKuIpxJHw"}]');
    let currentIndex = 0;
    let player;

    // Charger l'API YouTube
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        loadVideo();
    }

    function loadVideo() {
        if (tracks.length === 0) return;
        const track = tracks[currentIndex];
        const videoId = track.url.split('v=')[1];

        document.getElementById('title').innerText = track.titre;
        document.getElementById('artist').innerText = track.artiste;
        document.getElementById('progress').innerText = (currentIndex + 1) + " / " + tracks.length;

        if (!player) {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: { 
                    'autoplay': 1, 
                    'mute': 1,        // Crucial pour l'autoplay mobile
                    'playsinline': 1, // Garde la vidéo dans la page
                    'rel': 0 
                },
                events: {
                    'onStateChange': (e) => {
                        if (e.data == YT.PlayerState.ENDED) changeTrack(1);
                    }
                }
            });
        } else {
            player.loadVideoById(videoId);
        }
    }

    function changeTrack(delta) {
        currentIndex += delta;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= tracks.length) {
            alert("Session terminée !");
            return;
        }
        loadVideo();
    }

    async function vote(note) {
        const track = tracks[currentIndex];
        // Envoi asynchrone sans bloquer l'utilisateur
        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ artiste: track.artiste, titre: track.titre, note: note })
        });
        changeTrack(1);
    }
</script>
</body>
</html>
